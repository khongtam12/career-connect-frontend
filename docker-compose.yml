# ==============================================================
#  CAREER CONNECT - Frontend Docker Compose
#  Repo: FE (frontend)
#
#  Chay FE:
#    docker-compose up --build -d
#
#  Truy cap: http://localhost:3000
# ==============================================================

networks:
  career-net:
    external: true

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    networks:
      - career-net
    restart: on-failure
